# Hardware build: SH1107 128×128 on XIAO-nRF52840
# Usage: ./docker/build.sh hw_sh1107_128
CONFIG_NOKIA_LCD_WIDTH=128
CONFIG_NOKIA_LCD_HEIGHT=128
CONFIG_NOKIA_BACKEND_SH1107_I2C=y
CONFIG_NOKIA_SH1107_I2C_ADDR=0x3C
CONFIG_NOKIA_DISPLAY_ROTATION=0
CONFIG_NOKIA_DISPLAY_VFLIP=n
CONFIG_NOKIA_SH1107_SEG_REMAP=n
CONFIG_NOKIA_SH1107_COM_REMAP=n
CONFIG_GPIO=y
CONFIG_NOKIA_KEYPAD_MCP23008=y
CONFIG_NOKIA_MCP23008_I2C_ADDR=0x20
CONFIG_NOKIA_KEYPAD_ROTATION=0
