# Nokia 3310 / PCD8544 compatible — 84 × 48 pixels (default, no override needed)
CONFIG_NOKIA_LCD_WIDTH=84
CONFIG_NOKIA_LCD_HEIGHT=48
# Disable USB in simulation — Renode doesn't simulate USBD, causing a busy-loop.
# xiao_ble routes the UART console through USB CDC; disable the stack and driver.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_NRFX=n
CONFIG_UART_CONSOLE=n
