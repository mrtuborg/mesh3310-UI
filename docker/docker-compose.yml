services:
  zephyr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/work          # ← repo root
    working_dir: /work
    entrypoint: ["/work/docker/entrypoint.sh"]
    command: >
     west build
     -b nrf52840dk/nrf52840
     firmware/app
     -d build
     --
     -DKCONFIG_WARNINGS_AS_ERRORS=OFF

