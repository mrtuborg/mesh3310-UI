name: UI Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# zephyrprojectrtos/ci:v0.26.14 ships Zephyr SDK 0.16.x, matching Zephyr 3.6.0.
# ghcr.io/zephyrproject-rtos/zephyr-build:latest now ships SDK 1.0.1 which is
# incompatible (Zephyr 3.6.0 cmake requires SDK major version 0).

jobs:
  # ------------------------------------------------------------------ #
  # Job 1: host build — runs on every push, no Zephyr needed            #
  # ------------------------------------------------------------------ #
  host-tests:
    name: Host tests (cc, no Zephyr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run
        run: make -C firmware/tests clean test

  # ------------------------------------------------------------------ #
  # Job 2: Firmware build for nRF52                                     #
  # ------------------------------------------------------------------ #
  firmware-build:
    name: Firmware build (nRF52, Zephyr 3.6.0)
    runs-on: ubuntu-latest
    container:
      image: zephyrprojectrtos/ci:v0.26.14
      options: --user root

    steps:
      - uses: actions/checkout@v4
        with:
          path: Nokia3310-UI

      - name: West init & update
        working-directory: Nokia3310-UI
        run: |
          git config --global --add safe.directory "$(pwd)"
          west init -l west-manifest
          west update --narrow -o=--depth=1

      - name: Build firmware
        working-directory: Nokia3310-UI
        shell: bash
        run: |
          source "$(west list zephyr -f '{path}')/zephyr-env.sh"
          west build -b nrf52dk_nrf52805 firmware/app -d build

  # ------------------------------------------------------------------ #
  # Job 3: Ztest via west twister on Linux native_sim                   #
  # ------------------------------------------------------------------ #
  ztest:
    name: Ztest (native_sim, Zephyr 3.6.0)
    runs-on: ubuntu-latest
    container:
      image: zephyrprojectrtos/ci:v0.26.14
      options: --user root

    steps:
      - uses: actions/checkout@v4
        with:
          path: Nokia3310-UI

      - name: West init & update
        working-directory: Nokia3310-UI
        run: |
          git config --global --add safe.directory "$(pwd)"
          west init -l west-manifest
          west update --narrow -o=--depth=1

      - name: Run twister
        working-directory: Nokia3310-UI
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          west twister \
            -T firmware/tests \
            --platform native_sim \
            --inline-logs \
            -v
