name: UI Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Image shared by both Zephyr jobs — same as docker/Dockerfile
env:
  ZEPHYR_BUILD_IMAGE: ghcr.io/zephyrproject-rtos/zephyr-build:latest

jobs:
  # ------------------------------------------------------------------ #
  # Job 1: host build — runs on every push, no Zephyr needed            #
  # ------------------------------------------------------------------ #
  host-tests:
    name: Host tests (cc, no Zephyr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run
        run: make -C firmware/tests clean test

  # ------------------------------------------------------------------ #
  # Job 2: Firmware build for nRF52 — same image as local docker build  #
  # ------------------------------------------------------------------ #
  firmware-build:
    name: Firmware build (nRF52, Zephyr 3.6.0)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4
        with:
          path: Nokia3310-UI

      - name: West init & update
        working-directory: Nokia3310-UI
        run: |
          git config --global --add safe.directory "$(pwd)"
          west init -l west-manifest
          west update --narrow -o=--depth=1

      - name: Register Zephyr SDK with cmake
        run: |
          sdk=$(find /opt/toolchains -maxdepth 1 -name 'zephyr-sdk-*' -type d | head -1)
          echo "Found SDK: $sdk"
          "$sdk/setup.sh" -c

      - name: Build firmware
        working-directory: Nokia3310-UI
        shell: bash
        run: |
          source "$(west list zephyr -f '{path}')/zephyr-env.sh"
          west build -b nrf52dk_nrf52805 firmware/app -d build

  # ------------------------------------------------------------------ #
  # Job 3: Ztest via west twister on Linux native_sim                   #
  # ------------------------------------------------------------------ #
  ztest:
    name: Ztest (native_sim, Zephyr 3.6.0)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4
        with:
          path: Nokia3310-UI

      - name: West init & update
        working-directory: Nokia3310-UI
        run: |
          git config --global --add safe.directory "$(pwd)"
          west init -l west-manifest
          west update --narrow -o=--depth=1

      - name: Run twister
        working-directory: Nokia3310-UI
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          west twister \
            -T firmware/tests \
            --platform native_sim \
            --inline-logs \
            -v
